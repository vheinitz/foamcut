; Endschalter-Logger, siehe endstop_test.ino (identisch mit src/main.cpp).
;   pio run -t upload        ; danach: pio device monitor -b 115200
[env:revA]
platform         = atmelavr
board            = megaatmega2560
framework        = arduino
upload_protocol  = wiring
upload_port      = /dev/ttyUSB0
monitor_speed    = 115200
