; foamcut hardware self test - GT2560 (ATmega2560)
;
;   pio run -e revA -t upload        # GT2560 Rev.A / Rev.A+   (default)
;   pio run -e v3   -t upload        # GT2560 V3
;   pio device monitor -b 115200
;
; If the board is not on /dev/ttyUSB0, either set upload_port below or
; export PLATFORMIO_UPLOAD_PORT=/dev/ttyUSBx.

[env]
platform         = atmelavr
board            = megaatmega2560
framework        = arduino
upload_protocol  = wiring
monitor_speed    = 115200
monitor_echo     = yes
build_flags      = -Wall

[env:revA]
build_flags      = ${env.build_flags} -DGT2560_REV_A

[env:v3]
build_flags      = ${env.build_flags} -DGT2560_V3
